<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-modern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="50%" stop-color="#1b2028"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="gold-hairline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd9b6"/>
      <stop offset="50%" stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#937c5b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg-modern)"/>
  <!-- Minimalist Geometric Hairline Frame -->
  <rect x="25" y="25" width="350" height="190" fill="none" stroke="url(#gold-hairline)" stroke-width="1"/>
  <rect x="35" y="15" width="330" height="210" fill="none" stroke="url(#gold-hairline)" stroke-width="1" opacity="0.4"/>
  <!-- Modern Monogram Frame in Center -->
  <g transform="translate(200, 105)">
    <circle cx="0" cy="0" r="45" fill="#1b2028" stroke="url(#gold-hairline)" stroke-width="1.5"/>
    <text x="0" y="8" fill="#fcfaf7" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="300" text-anchor="middle" letter-spacing="4">M &amp; S</text>
  </g>
  <!-- Sleek Badge -->
  <rect x="110" y="185" width="180" height="26" fill="#14171d" stroke="url(#gold-hairline)" stroke-width="1"/>
  <text x="200" y="202" fill="#ecd9b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="3">MODERN MINIMAL</text>
  <text x="200" y="160" fill="#937c5b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle" letter-spacing="2">CONTEMPORARY LUXURY</text>
</svg>
