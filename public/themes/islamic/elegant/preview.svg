<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-islamic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a22"/>
      <stop offset="50%" stop-color="#103d32"/>
      <stop offset="100%" stop-color="#051712"/>
    </linearGradient>
    <linearGradient id="gold-islamic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg-islamic)"/>
  <!-- Moorish Dome Arch Silhouette -->
  <path d="M 120 230 L 120 120 C 120 70 200 40 200 40 C 200 40 280 70 280 120 L 280 230" fill="none" stroke="url(#gold-islamic)" stroke-width="2"/>
  <path d="M 130 230 L 130 125 C 130 80 200 52 200 52 C 200 52 270 80 270 125 L 270 230" fill="none" stroke="url(#gold-islamic)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Rub el Hizb (Eight-pointed Star) -->
  <g transform="translate(200, 110)">
    <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="url(#gold-islamic)" stroke-width="1.5"/>
    <rect x="-16" y="-16" width="32" height="32" transform="rotate(45)" fill="none" stroke="url(#gold-islamic)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="url(#gold-islamic)"/>
  </g>
  <!-- Decorative Arch Outline -->
  <path d="M 40 20 Q 200 5 360 20" fill="none" stroke="url(#gold-islamic)" stroke-width="1.5"/>
  <!-- Islamic Elegant Badge -->
  <rect x="95" y="190" width="210" height="28" rx="6" fill="#061f18" stroke="url(#gold-islamic)" stroke-width="1.5"/>
  <text x="200" y="209" fill="#fcf3d9" font-family="'Amiri', serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="3">ISLAMIC ELEGANT</text>
  <text x="200" y="160" fill="#ecd58c" font-family="'Amiri', serif" font-size="13" text-anchor="middle" font-style="italic">Kemewahan Bernuansa Syar'i</text>
</svg>
