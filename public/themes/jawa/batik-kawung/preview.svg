<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-soga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2011"/>
      <stop offset="50%" stop-color="#542e18"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="gold-soga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3cb85"/>
      <stop offset="50%" stop-color="#d49b55"/>
      <stop offset="100%" stop-color="#9d6422"/>
    </linearGradient>
    <pattern id="kawung" width="40" height="40" patternUnits="userSpaceOnUse">
      <ellipse cx="20" cy="10" rx="6" ry="10" fill="none" stroke="#d49b55" stroke-opacity="0.25" stroke-width="1.5"/>
      <ellipse cx="20" cy="30" rx="6" ry="10" fill="none" stroke="#d49b55" stroke-opacity="0.25" stroke-width="1.5"/>
      <ellipse cx="10" cy="20" rx="10" ry="6" fill="none" stroke="#d49b55" stroke-opacity="0.25" stroke-width="1.5"/>
      <ellipse cx="30" cy="20" rx="10" ry="6" fill="none" stroke="#d49b55" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="3" fill="#d49b55" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="240" fill="url(#bg-soga)"/>
  <rect width="400" height="240" fill="url(#kawung)"/>
  <!-- Elegant Oval Gold Frame in center -->
  <circle cx="200" cy="110" r="65" fill="none" stroke="url(#gold-soga)" stroke-width="2"/>
  <circle cx="200" cy="110" r="60" fill="none" stroke="url(#gold-soga)" stroke-width="1" stroke-dasharray="4 2"/>
  <!-- Center Kawung Flower -->
  <ellipse cx="200" cy="95" rx="8" ry="15" fill="none" stroke="url(#gold-soga)" stroke-width="2"/>
  <ellipse cx="200" cy="125" rx="8" ry="15" fill="none" stroke="url(#gold-soga)" stroke-width="2"/>
  <ellipse cx="185" cy="110" rx="15" ry="8" fill="none" stroke="url(#gold-soga)" stroke-width="2"/>
  <ellipse cx="215" cy="110" rx="15" ry="8" fill="none" stroke="url(#gold-soga)" stroke-width="2"/>
  <circle cx="200" cy="110" r="5" fill="url(#gold-soga)"/>
  <!-- Rounded Pill Badge -->
  <rect x="90" y="190" width="220" height="28" rx="14" fill="#2a1408" stroke="url(#gold-soga)" stroke-width="1.5"/>
  <text x="200" y="209" fill="#f8e5c4" font-family="'Cormorant Garamond', serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="3">BATIK KAWUNG</text>
  <text x="200" y="155" fill="#f3cb85" font-family="'Merriweather', serif" font-size="12" text-anchor="middle" font-style="italic">Filosofi Kesucian &amp; Pengendalian Diri</text>
</svg>
