<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Platform Undangan Digital</title>
  <link rel="stylesheet" href="/css/core.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;background:#090d16;">
  <div style="max-width:400px;width:100%;background:#131b2a;border:1px solid #232f45;border-radius:16px;padding:2.25rem;box-shadow:var(--shadow-lg);">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:12px;background:rgba(59,130,246,0.15);color:#60a5fa;font-size:1.75rem;margin-bottom:1rem;">
        🔐
      </div>
      <h2 style="font-size:1.4rem;font-weight:700;color:#fff;">Login Administrator</h2>
      <p style="font-size:0.85rem;color:#94a3b8;margin-top:0.35rem;">Platform Undangan Digital</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="adminId">Admin ID</label>
        <input type="text" id="adminId" class="form-control" placeholder="Contoh: admin" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.75rem;">
        Masuk ke Dashboard
      </button>
    </form>

    <div style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:#64748b;">
      Default demo: <code>admin</code> / <code>admin123</code>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
